walking:
  axis_threshold: 0.3
  
  # PID controller for pitch stabilization
  # Uses simple-pid library (pip install simple-pid)
  stabilization_pid:
    enabled: true
    # Pitch setpoint (usually 90° for upright posture)
    setpoint: 75.0
    # PID gains (defaults used if no calibrated values)
    kp: 0.045086     # Proportional gain (start with small values)
    ki: 0.128103       # Integral gain (start at 0, then increase if needed)
    kd: 0.009100       # Derivative gain (start at 0, then increase to reduce oscillations)
    # Output limits (init_x_offset)
    upper_limit: 15.05   # Maximum X offset
    lower_limit: -15.05  # Minimum X offset
    
    # Automatic PID controller calibration
    # The system tests different angles and optimizes the parameters
    calibration:
      enabled: false  # Enable calibration mode (true/false)
      start_delay: 5.0  # Delay before calibration starts (seconds)
      duration: 120.0  # Total data collection time (seconds, determines number of cycles)
      target_angle: 85.0  # Target angle for calibration (degrees)
      angle_range: 5.0  # Calibration angle range ±5° (80° - 90°)
      setpoint_duration: 10.0  # Hold time per angle (seconds)
    
  
  height:
    axis_threshold: 0.5
    update_interval: 0.05
    step: 0.005
    min: 0.025
    max: 0.06
    default: 0.025
    reset:
      target: 0.025
      step: 0.005
      delay: 0.05
  
  speed_modes:
    1:
      name: "Very Low Speed"
      period_time: [400, 0.5, 0.02] #[period_ms (time for one full left+right step), dsp_ratio (fraction of cycle with both feet on the ground), y_swap_amplitude (side-to-side distance variation)]
      move_amplitudes:
        x: -0.01 #distance oscillating left and right
        y: 0.012 #distance oscillating forward and backward
        angle: 10.0 #body yaw rotation angle
      z_move_amplitude: 0.025 #foot lift height
      arm_swap: 30.0 #arm swing amplitude
      gait_base:
        step_fb_ratio: 0.070 #base X distance between left and right feet
        z_swap_amplitude: 0.002 #up-and-down oscillation distance
        init_y_offset: 0.03 #leg spread / leg bring-in
        body_height: 0.04 #robot body height
        init_x_offset: 0.0 #initial body offset along X (forward/backward)
        init_roll_offset: 0.0 #initial roll offset left/right
        pelvis_offset: 5.0 #pelvis offset (distance between left/right hip yaw joints)
        step_height: 0.02 #step (foot lift) height
    2:
      name: "Low Speed"
      period_time: [280, 0.48, 0.02]
      move_amplitudes:
        x: 0.01
        y: 0.012
        angle: 10.0
      z_move_amplitude: 0.025
      arm_swap: 30.0
      gait_base:
        step_fb_ratio: 0.090
        z_swap_amplitude: 0.002
        init_y_offset: 0.03
        body_height: 0.04
        init_x_offset: 0.0
        init_roll_offset: 0.0
        pelvis_offset: 5.0
        step_height: 0.026
    
