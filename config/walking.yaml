walking:
  axis_threshold: 0.3
  
  # PID контроллер для стабилизации по pitch
  # Использует библиотеку simple-pid (pip install simple-pid)
  stabilization_pid:
    enabled: true
    # Целевое значение pitch (обычно 90° для вертикального положения)
    setpoint: 75.0
    # Коэффициенты PID (начальные значения, используются если нет откалиброванных)
    kp: 0.045086     # Пропорциональный коэффициент (начните с малых значений)
    ki: 0.128103       # Интегральный коэффициент (0 для начала, затем увеличивайте при необходимости)
    kd: 0.009100       # Дифференциальный коэффициент (0 для начала, затем увеличивайте для уменьшения колебаний)
    # Пределы выходного сигнала (init_x_offset)
    upper_limit: 15.05   # Максимальное смещение по X
    lower_limit: -15.05  # Минимальное смещение по X
    
    # Автоматическая калибровка PID регулятора
    # Система автоматически тестирует разные углы и оптимизирует параметры
    calibration:
      enabled: false  # Включить режим калибровки (true/false)
      start_delay: 5.0  # Задержка перед началом калибровки в секундах
      duration: 120.0  # Общая длительность сбора данных в секундах (определяет количество циклов)
      target_angle: 85.0  # Целевой угол для калибровки (градусы)
      angle_range: 5.0  # Диапазон углов для калибровки ±5° (80° - 90°)
      setpoint_duration: 10.0  # Время удержания каждого угла в секундах
    
  
  height:
    axis_threshold: 0.5
    update_interval: 0.05
    step: 0.005
    min: 0.025
    max: 0.06
    default: 0.025
    reset:
      target: 0.025
      step: 0.005
      delay: 0.05
  
  speed_modes:
    1:
      name: "Very Low Speed"
      period_time: [400, 0.5, 0.02] #[period_ms (период поднятия ног(левую и правую) по одному разу), dsp_ratio(доля времени, в течение которого обе ноги находятся на земле в цикле), y_swap_amplitude(изменение расстояния влево и вправо)]
      move_amplitudes:
        x: -0.01 #расстояние, плавающее влево и вправо
        y: 0.012 #расстояние, плавающее вперед и назад
        angle: 10.0 #угол поворота туловища
      z_move_amplitude: 0.025 #высота подъема ноги
      arm_swap: 30.0 #амплитуда взмаха руками
      gait_base:
        step_fb_ratio: 0.070 #X универсальное расстояние между левой и правой стопами
        z_swap_amplitude: 0.002 #расстояние, плавающее вверх и вниз
        init_y_offset: 0.03 #Раздвиг ног/Здвиг ног
        body_height: 0.04 #Рост тела робота
        init_x_offset: 0.0 #начальное положение смещено туловище в направлении x (спереди и сзади)
        init_roll_offset: 0.0 #начальное смещение наклона влево и вправо
        pelvis_offset: 5.0 #смещение таза (расстояние между поворотами тазобедренных суставов влево и вправо)
        step_height: 0.02 #Подъем ног
    2:
      name: "Low Speed"
      period_time: [280, 0.48, 0.02]
      move_amplitudes:
        x: 0.01
        y: 0.012
        angle: 10.0
      z_move_amplitude: 0.025
      arm_swap: 30.0
      gait_base:
        step_fb_ratio: 0.090
        z_swap_amplitude: 0.002
        init_y_offset: 0.03
        body_height: 0.04
        init_x_offset: 0.0
        init_roll_offset: 0.0
        pelvis_offset: 5.0
        step_height: 0.026
    
    3:
      name: "Medium Speed"
      period_time: [280, 0.38, 0.02]
      move_amplitudes:
        x: 0.02
        y: 0.012
        angle: 10.0
      z_move_amplitude: 0.025
      arm_swap: 30.0
      gait_base:
        step_fb_ratio: 0.090
        z_swap_amplitude: 0.002
        init_y_offset: 0.03
        body_height: 0.04
        init_x_offset: 0.0
        init_roll_offset: 0.0
        pelvis_offset: 5.0
        step_height: 0.025
    
    4:
      name: "High Speed"
      period_time: [400, 0.5, 0.03] #[period_ms (период поднятия ног(левую и правую) по одному разу), dsp_ratio(доля времени, в течение которого обе ноги находятся на земле в цикле), y_swap_amplitude(изменение расстояния влево и вправо)]
      move_amplitudes:
        x: 0.019 #расстояние, плавающее влево и вправо
        y: 0.012 #расстояние, плавающее вперед и назад
        angle: 10.0 #угол поворота туловища
      z_move_amplitude: 0.02 #высота подъема ноги
      arm_swap: 30.0 #амплитуда взмаха руками
      gait_base:
        step_fb_ratio: 0.070 #X универсальное расстояние между левой и правой стопами
        z_swap_amplitude: 0.002 #расстояние, плавающее вверх и вниз
        init_y_offset: 0.038 #Раздвиг/Здвиг ног
        body_height: 0.04 #Рост тела робота
        init_x_offset: 0.0 #начальное положение смещено туловище в направлении x (спереди и сзади)
        init_roll_offset: 0.0 #начальное смещение наклона влево и вправо
        pelvis_offset: 5.0 #смещение таза (расстояние между поворотами тазобедренных суставов влево и вправо)
        step_height: 0.028 #Подъем ног

